<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D-DAY UNIVERSE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070a12;
  --panel:#111725;
  --panel2:#171e30;
  --text:#f5f7ff;
  --sub:#9ca7bd;
  --line:rgba(255,255,255,.08);
  --accent:#6d8cff;
  --accent2:#a66dff;
  --green:#42df9b;
  --red:#ff6378;
  --yellow:#ffd45c;
  --shadow:0 20px 60px rgba(0,0,0,.3);
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(109,140,255,.12),transparent 35%),
    radial-gradient(circle at 90% 10%,rgba(166,109,255,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans KR",sans-serif;
  overflow-x:hidden;
  transition:
    background .8s,
    color .5s;
}

/* =========================
   HOLIDAY THEMES
========================= */

body.theme-christmas{
  --accent:#ff526c;
  --accent2:#51d98c;
  --panel:#141923;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,82,108,.18),transparent 30%),
    radial-gradient(circle at 85% 0%,rgba(81,217,140,.15),transparent 30%),
    #080b10;
}

body.theme-children{
  --accent:#ff70b7;
  --accent2:#6e9cff;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,112,183,.18),transparent 28%),
    radial-gradient(circle at 85% 10%,rgba(110,156,255,.16),transparent 28%),
    #090b14;
}

body.theme-liberation{
  --accent:#5c83ff;
  --accent2:#ff5268;
  background:
    radial-gradient(circle at 15% 0%,rgba(70,105,255,.16),transparent 30%),
    radial-gradient(circle at 85% 0%,rgba(255,70,90,.13),transparent 30%),
    #070a12;
}

body.theme-newyear{
  --accent:#ffd35c;
  --accent2:#ff7f50;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,211,92,.16),transparent 32%),
    #080a11;
}

body.theme-holiday{
  --accent:#b887ff;
  --accent2:#6d9cff;
}

/* =========================
   EFFECT LAYERS
========================= */

#effects{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  overflow:hidden;
}

.snow{
  position:absolute;
  top:-30px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:white;
  opacity:.75;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

.confetti{
  position:absolute;
  top:-20px;
  width:7px;
  height:14px;
  animation:confettiFall linear infinite;
}

@keyframes confettiFall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

.balloon{
  position:absolute;
  bottom:-100px;
  width:35px;
  height:45px;
  border-radius:50%;
  opacity:.4;
  animation:balloonUp 12s linear infinite;
}

@keyframes balloonUp{
  to{
    transform:translateY(-120vh);
  }
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(20px);
  background:rgba(7,10,18,.78);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--accent);
}

.clock{
  color:var(--sub);
  font-size:13px;
  font-variant-numeric:tabular-nums;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1200px;
  margin:auto;
  padding:20px 16px 70px;
}

.hero{
  padding:30px 0 25px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  border-radius:999px;
  color:var(--sub);
  font-size:12px;
  margin-bottom:14px;
}

.hero h1{
  font-size:clamp(34px,7vw,68px);
  line-height:1;
  letter-spacing:-3px;
  margin-bottom:13px;
}

.hero h1 span{
  color:var(--accent);
}

.hero-date{
  color:var(--sub);
  font-size:15px;
}

/* =========================
   YEAR CARD
========================= */

.year-card{
  background:
    linear-gradient(
      135deg,
      rgba(109,140,255,.13),
      rgba(166,109,255,.08)
    );
  border:1px solid var(--line);
  border-radius:25px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.year-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.year-title{
  font-size:15px;
  font-weight:800;
}

.year-percent{
  font-weight:900;
  color:var(--accent);
}

.progress{
  height:9px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
  border-radius:999px;
  transition:width .5s;
}

.year-count{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.time-box{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  padding:12px 7px;
  border-radius:15px;
  text-align:center;
}

.time-box strong{
  display:block;
  font-size:20px;
  font-variant-numeric:tabular-nums;
}

.time-box span{
  display:block;
  margin-top:3px;
  font-size:10px;
  color:var(--sub);
}

/* =========================
   TODAY
========================= */

.today-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:16px;
  margin-bottom:20px;
}

.panel{
  background:rgba(17,23,37,.9);
  border:1px solid var(--line);
  border-radius:23px;
  padding:21px;
  box-shadow:var(--shadow);
}

.panel-label{
  color:var(--accent);
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:9px;
}

.history-title{
  font-size:22px;
  font-weight:900;
  margin-bottom:6px;
}

.history-years{
  color:var(--accent);
  font-weight:900;
  margin-bottom:10px;
}

.history-desc{
  color:var(--sub);
  line-height:1.6;
  font-size:14px;
}

.holiday-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.holiday-tag{
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
}

/* =========================
   SEARCH
========================= */

.controls{
  display:flex;
  gap:9px;
  margin:18px 0 12px;
}

.search{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:15px;
  padding:14px 15px;
  outline:none;
  font-size:14px;
}

.search:focus{
  border-color:var(--accent);
}

.add-btn{
  border:0;
  background:var(--accent);
  color:white;
  border-radius:15px;
  padding:0 17px;
  font-weight:900;
  cursor:pointer;
}

.categories{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:7px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--sub);
  padding:8px 12px;
  border-radius:999px;
  cursor:pointer;
  font-size:12px;
}

.cat.active{
  background:var(--accent);
  color:white;
  border-color:transparent;
}

/* =========================
   SECTION
========================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:25px 0 12px;
}

.section-head h2{
  font-size:22px;
}

.section-head span{
  color:var(--sub);
  font-size:12px;
}

/* =========================
   DDAY CARDS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.card{
  position:relative;
  overflow:hidden;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:21px;
  padding:18px;
  min-height:165px;
  transition:
    transform .25s,
    border-color .25s,
    box-shadow .25s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(109,140,255,.35);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.card.today{
  border-color:var(--accent);
  box-shadow:
    0 0 0 1px rgba(109,140,255,.15),
    0 20px 50px rgba(0,0,0,.25);
}

.card-icon{
  font-size:27px;
  margin-bottom:10px;
}

.card-name{
  font-weight:900;
  font-size:17px;
  padding-right:20px;
}

.card-date{
  margin-top:5px;
  color:var(--sub);
  font-size:12px;
}

.dday{
  margin-top:18px;
  font-size:26px;
  font-weight:1000;
  letter-spacing:-1px;
}

.dday.done{
  color:var(--green);
}

.card-category{
  position:absolute;
  top:14px;
  right:14px;
  font-size:10px;
  color:var(--sub);
  border:1px solid var(--line);
  padding:4px 7px;
  border-radius:999px;
}

.custom-delete{
  position:absolute;
  right:13px;
  bottom:13px;
  border:0;
  background:rgba(255,90,110,.12);
  color:#ff7183;
  border-radius:8px;
  padding:5px 7px;
  cursor:pointer;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:18px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(500px,100%);
  background:#111725;
  border:1px solid var(--line);
  border-radius:24px;
  padding:23px;
  box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.modal h2{
  margin-bottom:17px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--sub);
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  padding:13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  outline:none;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:13px;
  border:0;
  cursor:pointer;
  font-weight:900;
}

.cancel{
  background:var(--panel2);
  color:var(--text);
}

.save{
  background:var(--accent);
  color:white;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:300;
  background:#fff;
  color:#111;
  padding:12px 17px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  color:#59647a;
  font-size:11px;
  padding:30px 0 10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){
  .today-grid{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:560px){
  main{
    padding:15px 12px 60px;
  }

  .header-inner{
    padding:13px 14px;
  }

  .hero{
    padding:22px 4px;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .year-count{
    gap:5px;
  }

  .time-box strong{
    font-size:17px;
  }

  .controls{
    position:sticky;
    top:59px;
    z-index:20;
    padding:7px 0;
    background:rgba(7,10,18,.9);
    backdrop-filter:blur(15px);
  }

  .add-btn{
    padding:0 14px;
  }
}
</style>
</head>

</main>

<div class="modal-bg" id="modalBg">

    </div>

        취소
      </button>

      <button class="save" id="saveBtn">
        저장
      </button>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

/* =====================================================
   CUSTOM EVENTS
===================================================== */

const STORAGE_KEY="dday_universe_custom";

let customEvents=
  JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");

let activeCategory="전체";

/* =====================================================
   HELPERS
===================================================== */

function pad(n){
  return String(n).padStart(2,"0");
}

function dateKey(date){
  return pad(date.getMonth()+1)+"-"+pad(date.getDate());
}

function currentYear(){
  return new Date().getFullYear();
}

function getTarget(monthDay){

  const now=new Date();

  let target=new Date(
    now.getFullYear(),
    Number(monthDay.slice(0,2))-1,
    Number(monthDay.slice(3,5)),
    0,0,0,0
  );

  if(target<new Date(now.getFullYear(),now.getMonth(),now.getDate())){
    target.setFullYear(target.getFullYear()+1);
  }

  return target;
}

function diff(target){

  const now=new Date();
  const ms=target-now;

  if(
    target.getFullYear()===now.getFullYear() &&
    target.getMonth()===now.getMonth() &&
    target.getDate()===now.getDate()
  ){
    return {
      text:"TODAY",
      days:0,
      today:true
    };
  }

  const days=Math.ceil(ms/86400000);

  return {
    text:days>0?`D-${days}`:`D+${Math.abs(days)}`,
    days,
    today:false
  };
}

function saveCustom(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(customEvents)
  );

}

/* =====================================================
   BUILD EVENTS
===================================================== */

function getAllEvents(){

  const base=events.map(e=>({
    name:e[0],
    date:e[1],
    icon:e[2],
    category:e[3],
    custom:false
  }));

  const lunar=lunar2026.map(e=>({
    name:e[0],
    date:e[1],
    icon:e[2],
    category:e[3],
    custom:false
  }));

  const custom=customEvents.map(e=>({
    ...e,
    custom:true
  }));

  return [...base,...lunar,...custom];

}

/* =====================================================
   CATEGORIES
===================================================== */

function renderCategories(){

  const all=getAllEvents();

  const cats=[
    "전체",
    ...new Set(all.map(x=>x.category))
  ];

  document.getElementById("categories").innerHTML=
    cats.map(c=>`
      <button
        class="cat ${c===activeCategory?"active":""}"
        onclick="selectCategory('${c}')"
      >
        ${c}
      </button>
    `).join("");

}

function selectCategory(category){

  activeCategory=category;

  renderCategories();
  render();

}

/* =====================================================
   RENDER
===================================================== */

function render(){

  const grid=document.getElementById("grid");

  const search=
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  let list=getAllEvents();

  if(activeCategory!=="전체"){
    list=list.filter(
      e=>e.category===activeCategory
    );
  }

  if(search){
    list=list.filter(
      e=>
        e.name.toLowerCase().includes(search) ||
        e.category.toLowerCase().includes(search)
    );
  }

  list.sort((a,b)=>{
    return getTarget(a.date)-getTarget(b.date);
  });

  document.getElementById("countText").textContent=
    `${list.length}개`;

  if(!list.length){

    grid.innerHTML=`
      <div class="panel" style="grid-column:1/-1">
        검색 결과가 없습니다.
      </div>
    `;

    return;
  }

  grid.innerHTML=list.map((e,index)=>{

    const target=getTarget(e.date);
    const d=diff(target);

    const dateText=
      `${target.getFullYear()}.`+
      `${pad(target.getMonth()+1)}.`+
      `${pad(target.getDate())}`;

    return `
      <article class="card ${d.today?"today":""}">

        <div class="card-category">
          ${e.category}
        </div>

        <div class="card-icon">
          ${e.icon}
        </div>

        <div class="card-name">
          ${escapeHTML(e.name)}
        </div>

        <div class="card-date">
          ${dateText}
        </div>

        <div class="dday ${d.today?"done":""}">
          ${d.text}
        </div>

        ${
          e.custom
          ?
          `<button
            class="custom-delete"
            onclick="deleteCustom(${index},'${encodeURIComponent(e.name)}')"
          >
            삭제
          </button>`
          :
          ""
        }

      </article>
    `;

  }).join("");

}

/* =====================================================
   YEAR COUNTDOWN
===================================================== */

function updateYear(){

  const now=new Date();

  const start=new Date(
    now.getFullYear(),
    0,1
  );

  const end=new Date(
    now.getFullYear()+1,
    0,1
  );

  const total=end-start;
  const passed=now-start;
  const remaining=end-now;

  const percent=
    Math.min(100,
      Math.max(0,
        passed/total*100
      )
    );

  const sec=Math.floor(remaining/1000);

  const days=Math.floor(sec/86400);
  const hours=Math.floor((sec%86400)/3600);
  const minutes=Math.floor((sec%3600)/60);
  const seconds=sec%60;

  document.getElementById("yearLabel").textContent=
    now.getFullYear();

  document.getElementById("yearPercent").textContent=
    percent.toFixed(3)+"%";

  document.getElementById("yearBar").style.width=
    percent+"%";

  document.getElementById("yearDays").textContent=
    days;

  document.getElementById("yearHours").textContent=
    hours;

  document.getElementById("yearMinutes").textContent=
    minutes;

  document.getElementById("yearSeconds").textContent=
    seconds;

}

/* =====================================================
   HEADER / TODAY
===================================================== */

function updateToday(){

  const now=new Date();

  const dateString=
    now.toLocaleDateString(
      "ko-KR",
      {
        year:"numeric",
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

  document.getElementById("todayDate").textContent=
    dateString;

  document.getElementById("clock").textContent=
    `${pad(now.getHours())}:`+
    `${pad(now.getMinutes())}:`+
    `${pad(now.getSeconds())}`;

  const key=dateKey(now);

  const records=history[key]||[];

  if(records.length){

    const h=records[0];

    const years=
      now.getFullYear()-h.year;

    document.getElementById("historyTitle").textContent=
      h.title;

    document.getElementById("historyYears").textContent=
      `${years}년 전 오늘`;

    document.getElementById("historyDesc").textContent=
      h.desc;

  }else{

    document.getElementById("historyTitle").textContent=
      "오늘도 역사 속의 하루";

    document.getElementById("historyYears").textContent=
      "오늘의 기록";

    document.getElementById("historyDesc").textContent=
      "수많은 사건과 사람들이 오늘이라는 날짜를 만들어 왔습니다.";

  }

  const todayEvents=
    getAllEvents().filter(e=>e.date===key);

  const tags=document.getElementById("todayTags");

  if(todayEvents.length){

    tags.innerHTML=
      todayEvents
        .slice(0,12)
        .map(e=>`
          <div class="holiday-tag">
            ${e.icon} ${escapeHTML(e.name)}
          </div>
        `)
        .join("");

  }else{

    tags.innerHTML=
      `<div class="holiday-tag">
        평범하지만 다시 오지 않는 하루
      </div>`;

  }

}

/* =====================================================
   HOLIDAY THEME
===================================================== */

let previousTheme="";

function clearTheme(){

  document.body.classList.remove(
    "theme-christmas",
    "theme-children",
    "theme-liberation",
    "theme-newyear",
    "theme-holiday"
  );

}

function holidayTheme(){

  const now=new Date();

  const md=dateKey(now);

  clearTheme();

  let theme="";

  if(md==="12-25"){
    theme="theme-christmas";
  }
  else if(md==="05-05"){
    theme="theme-children";
  }
  else if(md==="08-15"){
    theme="theme-liberation";
  }
  else if(md==="01-01"){
    theme="theme-newyear";
  }
  else if(
    [
      "03-01",
      "06-06",
      "07-17",
      "10-03",
      "10-09"
    ].includes(md)
  ){
    theme="theme-holiday";
  }

  if(theme){
    document.body.classList.add(theme);
  }

  if(theme!==previousTheme){

    previousTheme=theme;

    createEffects(theme);

  }

}

/* =====================================================
   SPECIAL EFFECTS
===================================================== */

function createEffects(theme){

  const layer=document.getElementById("effects");

  layer.innerHTML="";

  if(theme==="theme-christmas"){

    for(let i=0;i<65;i++){

      const el=document.createElement("div");

      el.className="snow";

      el.style.left=
        Math.random()*100+"%";

      el.style.animationDuration=
        5+Math.random()*8+"s";

      el.style.animationDelay=
        Math.random()*8+"s";

      el.style.opacity=
        .3+Math.random()*.7;

      layer.appendChild(el);

    }

  }

  else if(theme==="theme-children"){

    for(let i=0;i<18;i++){

      const el=document.createElement("div");

      el.className="balloon";

      el.style.left=
        Math.random()*100+"%";

      el.style.animationDelay=
        Math.random()*10+"s";

      el.style.background=
        `hsl(${Math.random()*360},80%,65%)`;

      layer.appendChild(el);

    }

  }

  else if(
    theme==="theme-newyear" ||
    theme==="theme-liberation" ||
    theme==="theme-holiday"
  ){

    for(let i=0;i<55;i++){

      const el=document.createElement("div");

      el.className="confetti";

      el.style.left=
        Math.random()*100+"%";

      el.style.background=
        `hsl(${Math.random()*360},80%,65%)`;

      el.style.animationDuration=
        5+Math.random()*7+"s";

      el.style.animationDelay=
        Math.random()*8+"s";

      layer.appendChild(el);

    }

  }

}

/* =====================================================
   CUSTOM MODAL
===================================================== */

const modalBg=
  document.getElementById("modalBg");

document.getElementById("addBtn")
  .onclick=()=>{
    modalBg.classList.add("show");
  };

document.getElementById("cancelBtn")
  .onclick=closeModal;

modalBg.addEventListener("click",e=>{
  if(e.target===modalBg){
    closeModal();
  }
});

function closeModal(){

  modalBg.classList.remove("show");

  document.getElementById("eventName").value="";
  document.getElementById("eventDate").value="";

}

/* =====================================================
   SAVE CUSTOM
===================================================== */

document.getElementById("saveBtn")
  .onclick=()=>{

    const name=
      document.getElementById("eventName")
        .value.trim();

    const date=
      document.getElementById("eventDate")
        .value;

    const category=
      document.getElementById("eventCategory")
        .value;

    if(!name||!date){

      showToast("이름과 날짜를 입력해주세요.");

      return;
    }

    const d=new Date(date+"T00:00:00");

    customEvents.push({

      name,
      date:
        pad(d.getMonth()+1)+
        "-"+
        pad(d.getDate()),

      icon:"📌",
      category

    });

    /*
      사용자가 지정한 날짜는 매년 반복되는 형태로 저장.
      개인 일정이 1회성일 경우에는 아래 구조를
      timestamp 방식으로 바꾸면 됨.
    */

    saveCustom();

    closeModal();

    renderCategories();
    render();

    showToast("D-Day가 추가되었습니다!");

  };

/* =====================================================
   DELETE CUSTOM
===================================================== */

function deleteCustom(index,name){

  const target=
    decodeURIComponent(name);

  const realIndex=
    customEvents.findIndex(
      e=>e.name===target
    );

  if(realIndex<0)return;

  if(
    !confirm(
      `"${target}" D-Day를 삭제할까요?`
    )
  )return;

  customEvents.splice(realIndex,1);

  saveCustom();

  renderCategories();
  render();

  showToast("삭제되었습니다.");

}

/* =====================================================
   SEARCH
===================================================== */

document.getElementById("search")
  .addEventListener("input",render);

/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

  const toast=
    document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(()=>{
      toast.classList.remove("show");
    },2200);

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =====================================================
   DAY CHANGE DETECTOR
===================================================== */

let lastDay=dateKey(new Date());

function checkDateChange(){

  const nowDay=
    dateKey(new Date());

  if(nowDay!==lastDay){

    lastDay=nowDay;

    holidayTheme();
    updateToday();
    updateYear();
    render();

    showToast("📅 새로운 하루가 시작되었습니다.");

  }

}

/* =====================================================
   INITIALIZE
===================================================== */

function init(){

  renderCategories();

  render();

  updateToday();

  updateYear();

  holidayTheme();

}

init();

/* =====================================================
   LIVE LOOP
===================================================== */

setInterval(()=>{

  updateToday();
  updateYear();
  holidayTheme();
  checkDateChange();

},1000);

</script>
