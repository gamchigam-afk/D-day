<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D-DAY UNIVERSE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070a12;
  --panel:#111725;
  --panel2:#171e30;
  --text:#f5f7ff;
  --sub:#9ca7bd;
  --line:rgba(255,255,255,.08);
  --accent:#6d8cff;
  --accent2:#a66dff;
  --green:#42df9b;
  --red:#ff6378;
  --yellow:#ffd45c;
  --shadow:0 20px 60px rgba(0,0,0,.3);
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(109,140,255,.12),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 10%,
      rgba(166,109,255,.10),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
  overflow-x:hidden;
  transition:
    background .8s,
    color .5s;
}

/* =====================================================
   THEMES
===================================================== */

body.theme-christmas{
  --accent:#ff526c;
  --accent2:#51d98c;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(255,82,108,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 0%,
      rgba(81,217,140,.15),
      transparent 30%
    ),
    #080b10;
}

body.theme-children{
  --accent:#ff70b7;
  --accent2:#6e9cff;
  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(255,112,183,.18),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 10%,
      rgba(110,156,255,.16),
      transparent 28%
    ),
    #090b14;
}

body.theme-liberation{
  --accent:#5c83ff;
  --accent2:#ff5268;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(70,105,255,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 0%,
      rgba(255,70,90,.13),
      transparent 30%
    ),
    #070a12;
}

body.theme-newyear{
  --accent:#ffd35c;
  --accent2:#ff7f50;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(255,211,92,.16),
      transparent 32%
    ),
    #080a11;
}

body.theme-holiday{
  --accent:#b887ff;
  --accent2:#6d9cff;
}

/* =====================================================
   EFFECTS
===================================================== */

#effects{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  overflow:hidden;
}

.snow{
  position:absolute;
  top:-30px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:white;
  opacity:.75;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(360deg);
  }
}

.confetti{
  position:absolute;
  top:-20px;
  width:7px;
  height:14px;
  animation:
    confettiFall linear infinite;
}

@keyframes confettiFall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);
  }
}

.balloon{
  position:absolute;
  bottom:-100px;
  width:35px;
  height:45px;
  border-radius:50%;
  opacity:.4;
  animation:
    balloonUp 12s linear infinite;
}

@keyframes balloonUp{
  to{
    transform:
      translateY(-120vh);
  }
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:50;

  backdrop-filter:blur(20px);

  background:rgba(7,10,18,.78);

  border-bottom:
    1px solid var(--line);
}

.header-inner{
  max-width:1200px;
  margin:auto;

  padding:
    15px 18px;

  display:flex;

  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:var(--accent);
}

.clock{
  color:var(--sub);
  font-size:13px;
  font-variant-numeric:tabular-nums;
}

/* =====================================================
   MAIN
===================================================== */

main{
  max-width:1200px;
  margin:auto;

  padding:
    20px 16px 70px;
}

.hero{
  padding:
    30px 0 25px;
}

.hero-badge{
  display:inline-flex;

  align-items:center;
  gap:7px;

  padding:
    7px 11px;

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.035);

  border-radius:999px;

  color:var(--sub);

  font-size:12px;

  margin-bottom:14px;
}

.hero h1{
  font-size:
    clamp(34px,7vw,68px);

  line-height:1;

  letter-spacing:-3px;

  margin-bottom:13px;
}

.hero h1 span{
  color:var(--accent);
}

.hero-date{
  color:var(--sub);
  font-size:15px;
}

/* =====================================================
   YEAR
===================================================== */

.year-card{
  background:
    linear-gradient(
      135deg,
      rgba(109,140,255,.13),
      rgba(166,109,255,.08)
    );

  border:
    1px solid var(--line);

  border-radius:25px;

  padding:22px;

  box-shadow:var(--shadow);

  margin-bottom:16px;
}

.year-top{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:14px;
}

.year-title{
  font-size:15px;
  font-weight:800;
}

.year-percent{
  font-weight:900;
  color:var(--accent);
}

.progress{
  height:9px;

  background:
    rgba(255,255,255,.08);

  border-radius:999px;

  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );

  border-radius:999px;

  transition:
    width .5s;
}

.year-count{
  margin-top:15px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}

.time-box{
  background:
    rgba(255,255,255,.045);

  border:
    1px solid var(--line);

  padding:12px 7px;

  border-radius:15px;

  text-align:center;
}

.time-box strong{
  display:block;

  font-size:20px;

  font-variant-numeric:
    tabular-nums;
}

.time-box span{
  display:block;

  margin-top:3px;

  font-size:10px;

  color:var(--sub);
}

/* =====================================================
   TODAY
===================================================== */

.today-grid{
  display:grid;

  grid-template-columns:
    1.4fr 1fr;

  gap:16px;

  margin-bottom:20px;
}

.panel{
  background:
    rgba(17,23,37,.9);

  border:
    1px solid var(--line);

  border-radius:23px;

  padding:21px;

  box-shadow:var(--shadow);
}

.panel-label{
  color:var(--accent);

  font-size:11px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;

  margin-bottom:9px;
}

/* =====================================================
   HISTORY
===================================================== */

.history-loading{
  color:var(--sub);

  display:flex;

  align-items:center;

  gap:10px;
}

.loading-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:
    var(--accent);

  animation:
    pulse 1s infinite;
}

@keyframes pulse{
  50%{
    opacity:.2;
    transform:scale(.6);
  }
}

.history-item{
  padding:
    12px 0;

  border-bottom:
    1px solid var(--line);
}

.history-item:last-child{
  border-bottom:0;
}

.history-year{
  display:inline-block;

  min-width:58px;

  color:var(--accent);

  font-size:18px;

  font-weight:1000;
}

.history-years{
  margin-top:3px;

  color:var(--sub);

  font-size:12px;
}

.history-text{
  margin-top:6px;

  color:var(--text);

  line-height:1.55;

  font-size:14px;
}

.history-link{
  display:inline-block;

  margin-top:7px;

  color:var(--accent);

  font-size:11px;

  text-decoration:none;
}

.history-link:hover{
  text-decoration:underline;
}

/* =====================================================
   TAGS
===================================================== */

.holiday-list{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:12px;
}

.holiday-tag{
  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.05);

  padding:
    7px 10px;

  border-radius:999px;

  font-size:12px;
}

/* =====================================================
   SEARCH
===================================================== */

.controls{
  display:flex;

  gap:9px;

  margin:
    18px 0 12px;
}

.search{
  flex:1;

  min-width:0;

  border:
    1px solid var(--line);

  background:
    var(--panel);

  color:var(--text);

  border-radius:15px;

  padding:
    14px 15px;

  outline:none;

  font-size:14px;
}

.search:focus{
  border-color:
    var(--accent);
}

.add-btn{
  border:0;

  background:
    var(--accent);

  color:white;

  border-radius:15px;

  padding:
    0 17px;

  font-weight:900;

  cursor:pointer;
}

/* =====================================================
   CATEGORIES
===================================================== */

.categories{
  display:flex;

  gap:7px;

  overflow-x:auto;

  padding-bottom:7px;

  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;

  border:
    1px solid var(--line);

  background:
    var(--panel);

  color:var(--sub);

  padding:
    8px 12px;

  border-radius:999px;

  cursor:pointer;

  font-size:12px;
}

.cat.active{
  background:
    var(--accent);

  color:white;

  border-color:
    transparent;
}

/* =====================================================
   SECTION
===================================================== */

.section-head{
  display:flex;

  justify-content:space-between;

  align-items:end;

  margin:
    25px 0 12px;
}

.section-head h2{
  font-size:22px;
}

.section-head span{
  color:var(--sub);
  font-size:12px;
}

/* =====================================================
   DDAY
===================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:13px;
}

.card{
  position:relative;

  overflow:hidden;

  background:
    var(--panel);

  border:
    1px solid var(--line);

  border-radius:21px;

  padding:18px;

  min-height:165px;

  transition:
    transform .25s,
    border-color .25s,
    box-shadow .25s;
}

.card:hover{
  transform:
    translateY(-4px);

  border-color:
    rgba(109,140,255,.35);

  box-shadow:
    0 20px 50px rgba(0,0,0,.25);
}

.card.today{
  border-color:
    var(--accent);

  box-shadow:
    0 0 0 1px
      rgba(109,140,255,.15),
    0 20px 50px
      rgba(0,0,0,.25);
}

.card-icon{
  font-size:27px;
  margin-bottom:10px;
}

.card-name{
  font-weight:900;

  font-size:17px;

  padding-right:20px;
}

.card-date{
  margin-top:5px;

  color:var(--sub);

  font-size:12px;
}

.dday{
  margin-top:18px;

  font-size:26px;

  font-weight:1000;

  letter-spacing:-1px;
}

.dday.done{
  color:var(--green);
}

.card-category{
  position:absolute;

  top:14px;
  right:14px;

  font-size:10px;

  color:var(--sub);

  border:
    1px solid var(--line);

  padding:
    4px 7px;

  border-radius:999px;
}

.custom-delete{
  position:absolute;

  right:13px;
  bottom:13px;

  border:0;

  background:
    rgba(255,90,110,.12);

  color:#ff7183;

  border-radius:8px;

  padding:
    5px 7px;

  cursor:pointer;
}

/* =====================================================
   MODAL
===================================================== */

.modal-bg{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.65);

  backdrop-filter:
    blur(8px);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:200;

  padding:18px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(500px,100%);

  background:#111725;

  border:
    1px solid var(--line);

  border-radius:24px;

  padding:23px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.5);
}

.modal h2{
  margin-bottom:17px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;

  font-size:12px;

  color:var(--sub);

  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;

  padding:13px;

  border-radius:13px;

  border:
    1px solid var(--line);

  background:
    var(--panel2);

  color:var(--text);

  outline:none;
}

.modal-actions{
  display:flex;

  gap:8px;

  margin-top:18px;
}

.modal-actions button{
  flex:1;

  padding:13px;

  border-radius:13px;

  border:0;

  cursor:pointer;

  font-weight:900;
}

.cancel{
  background:
    var(--panel2);

  color:var(--text);
}

.save{
  background:
    var(--accent);

  color:white;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  left:50%;
  bottom:25px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  z-index:300;

  background:#fff;

  color:#111;

  padding:
    12px 17px;

  border-radius:999px;

  font-size:13px;

  font-weight:800;

  transition:.3s;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;

  color:#59647a;

  font-size:11px;

  padding:
    30px 0 10px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

  .today-grid{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:560px){

  main{
    padding:
      15px 12px 60px;
  }

  .header-inner{
    padding:
      13px 14px;
  }

  .hero{
    padding:
      22px 4px;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .year-count{
    gap:5px;
  }

  .time-box strong{
    font-size:17px;
  }

  .controls{
    position:sticky;

    top:59px;

    z-index:20;

    padding:7px 0;

    background:
      rgba(7,10,18,.9);

    backdrop-filter:
      blur(15px);
  }

  .add-btn{
    padding:
      0 14px;
  }

}
</style>
</head>

<body>

<div id="effects"></div>

<header>
  <div class="header-inner">

    <div class="logo">
      D-DAY <span>UNIVERSE</span>
    </div>

    <div
      class="clock"
      id="clock"
    >
      00:00:00
    </div>

  </div>
</header>

<main>

<!-- =================================================
     HERO
================================================== -->

<section class="hero">

  <div class="hero-badge">
    ✦ 오늘도 시간이 흐르고 있습니다
  </div>

  <h1>
    별의 별<br>
    <span>D-Day</span>를 세다.
  </h1>

  <div
    class="hero-date"
    id="todayDate"
  ></div>

</section>

<!-- =================================================
     YEAR
================================================== -->

<section class="year-card">

  <div class="year-top">

    <div class="year-title">
      ⏳
      <span id="yearLabel">
        2026
      </span>
      년의 남은 시간
    </div>

    <div
      class="year-percent"
      id="yearPercent"
    >
      0%
    </div>

  </div>

  <div class="progress">

    <div
      class="progress-bar"
      id="yearBar"
    ></div>

  </div>

  <div class="year-count">

    <div class="time-box">
      <strong id="yearDays">0</strong>
      <span>일</span>
    </div>

    <div class="time-box">
      <strong id="yearHours">0</strong>
      <span>시간</span>
    </div>

    <div class="time-box">
      <strong id="yearMinutes">0</strong>
      <span>분</span>
    </div>

    <div class="time-box">
      <strong id="yearSeconds">0</strong>
      <span>초</span>
    </div>

  </div>

</section>

<!-- =================================================
     TODAY
================================================== -->

<section class="today-grid">

  <div class="panel">

    <div class="panel-label">
      ON THIS DAY
    </div>

    <div id="history">

      <div class="history-loading">

        <div class="loading-dot"></div>

        오늘의 역사를 불러오는 중...

      </div>

    </div>

  </div>

  <div class="panel">

    <div class="panel-label">
      TODAY
    </div>

    <div
      class="history-title"
      style="font-size:22px;font-weight:900;"
    >
      오늘의 특별한 날
    </div>

    <div
      class="holiday-list"
      id="todayTags"
    ></div>

  </div>

</section>

<!-- =================================================
     SEARCH
================================================== -->

<div class="controls">

  <input
    id="search"
    class="search"
    placeholder="🔎 D-Day 검색..."
  >

  <button
    class="add-btn"
    id="addBtn"
  >
    ＋ 추가
  </button>

</div>

<div
  class="categories"
  id="categories"
></div>

<div class="section-head">

  <h2>
    📅 D-Day 목록
  </h2>

  <span id="countText">
    0개
  </span>

</div>

<section
  class="grid"
  id="grid"
></section>

<footer>
  D-DAY UNIVERSE · 역사 데이터는 Wikimedia On This Day 기반
</footer>

</main>

<!-- =================================================
     MODAL
================================================== -->

<div
  class="modal-bg"
  id="modalBg"
>

  <div class="modal">

    <h2>
      새로운 D-Day
    </h2>

    <div class="field">

      <label>
        이름
      </label>

      <input
        id="eventName"
        placeholder="예: 내 생일"
      >

    </div>

    <div class="field">

      <label>
        날짜
      </label>

      <input
        id="eventDate"
        type="date"
      >

    </div>

    <div class="field">

      <label>
        카테고리
      </label>

      <select
        id="eventCategory"
      >
        <option>개인</option>
        <option>학교</option>
        <option>여행</option>
        <option>기념일</option>
        <option>기타</option>
      </select>

    </div>

    <div class="modal-actions">

      <button
        class="cancel"
        id="cancelBtn"
      >
        취소
      </button>

      <button
        class="save"
        id="saveBtn"
      >
        저장
      </button>

    </div>

  </div>

</div>

<div
  class="toast"
  id="toast"
></div>

<script>

/* =====================================================
   REAL D-DAY DATA
===================================================== */

const events = [

  /* KOREA */

  ["새해","01-01","🇰🇷","공휴일"],
  ["삼일절","03-01","🇰🇷","공휴일"],
  ["근로자의 날","05-01","👷","공휴일"],
  ["어린이날","05-05","🎈","공휴일"],
  ["현충일","06-06","🇰🇷","공휴일"],
  ["제헌절","07-17","📜","공휴일"],
  ["광복절","08-15","🇰🇷","공휴일"],
  ["개천절","10-03","🇰🇷","공휴일"],
  ["한글날","10-09","🔤","공휴일"],
  ["크리스마스","12-25","🎄","공휴일"],

  /* 2026 LUNAR */

  ["설날 연휴","02-16","🧧","공휴일"],
  ["설날","02-17","🧧","공휴일"],
  ["설날 연휴","02-18","🧧","공휴일"],

  ["부처님오신날","05-24","🪷","공휴일"],

  ["추석 연휴","09-24","🌕","공휴일"],
  ["추석","09-25","🌕","공휴일"],
  ["추석 연휴","09-26","🌕","공휴일"],

  /* INTERNATIONAL */

  ["세계 브라유의 날","01-04","⠿","국제"],

/* =====================================================
   BASIC HELPERS
===================================================== */

function pad(n){
  return String(n).padStart(2,"0");
}

function dateKey(date){
  return (
    pad(date.getMonth()+1) +
    "-" +
    pad(date.getDate())
  );
}

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =====================================================
   D-DAY
===================================================== */

function getTarget(monthDay){

  const now=new Date();

  let target=new Date(
    now.getFullYear(),
    Number(monthDay.slice(0,2))-1,
    Number(monthDay.slice(3,5)),
    0,0,0,0
  );

  const todayStart =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  if(target<todayStart){

    target.setFullYear(
      target.getFullYear()+1
    );

  }

  return target;

}

function diff(target){

  const now=new Date();

  if(
    target.getFullYear()===now.getFullYear() &&
    target.getMonth()===now.getMonth() &&
    target.getDate()===now.getDate()
  ){

    return {
      text:"TODAY",
      today:true
    };

  }

  const days=Math.ceil(
    (target-now)/86400000
  );

  return {
    text:
      days>0
        ? `D-${days}`
        : `D+${Math.abs(days)}`,
    today:false
  };

}

function getAllEvents(){

  const base =

/* =====================================================
   RENDER DDAY
===================================================== */

function render(){

  const grid=
    document.getElementById("grid");

  const search=
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  let list=getAllEvents();

  if(activeCategory!=="전체"){

    list=
      list.filter(
        e=>e.category===activeCategory
      );

  }

  if(search){

    list=
      list.filter(e=>
        e.name
          .toLowerCase()
          .includes(search)
        ||
        e.category
          .toLowerCase()
          .includes(search)
      );

  }

  list.sort(
    (a,b)=>
      getTarget(a.date) -
      getTarget(b.date)
  );

  document.getElementById(
    "countText"
  ).textContent =
    `${list.length}개`;

  if(!list.length){

    grid.innerHTML=`

      <div
        class="panel"
        style="grid-column:1/-1"
      >
        검색 결과가 없습니다.
      </div>

    `;

    return;
  }

  grid.innerHTML =
    list.map((e,index)=>{

      const target=
        getTarget(e.date);

      const d=
        diff(target);

      const dateText=
        `${target.getFullYear()}.`+
        `${pad(target.getMonth()+1)}.`+
        `${pad(target.getDate())}`;

      return `

        <article
          class="card
          ${d.today?"today":""}"
        >

          <div class="card-category">
            ${escapeHTML(e.category)}
          </div>

          <div class="card-icon">
            ${e.icon}
          </div>

          <div class="card-name">
            ${escapeHTML(e.name)}
          </div>

          <div class="card-date">
            ${dateText}
          </div>

          <div
            class="dday
            ${d.today?"done":""}"
          >
            ${d.text}
          </div>

          ${
            e.custom
              ?
              `
              <button
                class="custom-delete"
                onclick="deleteCustom('${encodeURIComponent(e.name)}')"
              >
                삭제
              </button>
              `
              :
              ""
          }

        </article>

      `;

    }).join("");

}

/* =====================================================
   YEAR COUNTDOWN
===================================================== */

function updateYear(){

  const now=new Date();

  const start=
    new Date(
      now.getFullYear(),
      0,
      1
    );

  const end=
    new Date(
      now.getFullYear()+1,
      0,
      1
    );

  const total=end-start;

  const passed=now-start;

  const remaining=end-now;

  const percent=
    Math.min(
      100,
      Math.max(
        0,
        passed/total*100
      )
    );

  const secondsTotal=
    Math.floor(
      remaining/1000
    );

  const days=
    Math.floor(
      secondsTotal/86400
    );

  const hours=
    Math.floor(
      (secondsTotal%86400)/3600
    );

  const minutes=
    Math.floor(
      (secondsTotal%3600)/60
    );

  const seconds=
    secondsTotal%60;

  document.getElementById(
    "yearLabel"
  ).textContent =
    now.getFullYear();

  document.getElementById(
    "yearPercent"
  ).textContent =
    percent.toFixed(3)+"%";

  document.getElementById(
    "yearBar"
  ).style.width =
    percent+"%";

  document.getElementById(
    "yearDays"
  ).textContent =
    days;

  document.getElementById(
    "yearHours"
  ).textContent =
    hours;

  document.getElementById(
    "yearMinutes"
  ).textContent =
    minutes;

  document.getElementById(
    "yearSeconds"
  ).textContent =
    seconds;

}

/* =====================================================
   WIKIMEDIA ON THIS DAY
===================================================== */

/*
  Wikimedia의 On This Day API.

  날짜만 바꿔서 요청하므로
  365일 전부 별도의 배열로 저장할 필요가 없다.

  예:
  /events/09/27
  /births/09/27
  /deaths/09/27
*/

async function loadHistory(){

  const now=new Date();

  const month=
    pad(now.getMonth()+1);

  const day=
    pad(now.getDate());

  const container=
    document.getElementById("history");

  container.innerHTML=`

    <div class="history-loading">

      <div class="loading-dot"></div>

      ${month}월 ${day}일의 역사를
      불러오는 중...

    </div>

  `;

  try{

    const url=
      `https://api.wikimedia.org/feed/v1/wikipedia/ko/onthisday/all/${month}/${day}`;

    const response=
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );

    if(!response.ok){
      throw new Error(
        "API ERROR"
      );
    }

    const data=
      await response.json();

    renderHistory(
      data,
      now
    );

  }catch(error){

    /*
      한국어 Wikipedia 데이터가 실패하면
      영어 Wikipedia 데이터로 한 번 더 시도.
    */

    try{

      const fallbackUrl=
        `https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${month}/${day}`;

      const response=
        await fetch(
          fallbackUrl,
          {
            headers:{
              "Accept":
                "application/json"
            }
          }
        );

      if(!response.ok){
        throw new Error(
          "FALLBACK ERROR"
        );
      }

      const data=
        await response.json();

      renderHistory(
        data,
        now
      );

    }catch(e){

      container.innerHTML=`

        <div class="history-title">
          오늘의 역사를 불러오지 못했습니다.
        </div>

        <div
          class="history-desc"
          style="margin-top:8px"
        >
          인터넷 연결을 확인한 뒤
          다시 접속해 주세요.
        </div>

      `;

    }

  }

}

/* =====================================================
   HISTORY RENDER
===================================================== */

function renderHistory(data,now){

  const container=
    document.getElementById("history");

  let items=[];

  /*
    selected가 가장 큐레이션된 항목이라
    먼저 보여준다.
  */

  if(
    Array.isArray(data.selected)
  ){
    items=[
      ...items,
      ...data.selected
    ];
  }

  if(
    Array.isArray(data.events)
  ){
    items=[
      ...items,
      ...data.events
    ];
  }

  if(
    Array.isArray(data.births)
  ){
    items=[
      ...items,
      ...data.births
    ];
  }

  if(
    Array.isArray(data.deaths)
  ){
    items=[
      ...items,
      ...data.deaths
    ];
  }

  /*
    중복 제거
  */

  const seen=new Set();

  items=
    items.filter(item=>{

      const key=
        `${item.year}|${item.text}`;

      if(seen.has(key)){
        return false;
      }

      seen.add(key);

      return true;

    });

  /*
    최대 6개만 표시.
    너무 많은 사건이 화면을
    차지하지 않도록 함.
  */

  items=
    items.slice(0,6);

  if(!items.length){

    container.innerHTML=`

      <div class="history-title">
        오늘의 역사 기록이 없습니다.
      </div>

      <div
        class="history-desc"
        style="margin-top:8px"
      >
        다른 역사 자료를 준비 중입니다.
      </div>

    `;

    return;
  }

  container.innerHTML =
    items.map(item=>{

      const years=
        now.getFullYear() -
        Number(item.year);

      let link="";

      if(
        item.pages &&
        item.pages.length &&
        item.pages[0]
      ){

        link=
          item.pages[0]
            .content_urls
            ?.desktop
            ?.page || "";

      }

      /*
        API의 text는 역사 사건의
        짧은 설명이다.
      */

      return `

        <div class="history-item">

          <div>

            <span class="history-year">
              ${item.year}
            </span>

            <span
              class="history-years"
            >
              ${years > 0
                ? `${years}년 전 오늘`
                : "오늘의 기록"}
            </span>

          </div>

          <div class="history-text">
            ${escapeHTML(item.text || "")}
          </div>

          ${
            link
              ?
              `
              <a
                class="history-link"
                href="${escapeHTML(link)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Wikipedia에서 자세히 보기 →
              </a>
              `
              :
              ""
          }

        </div>

      `;

    }).join("");

}

/* =====================================================
   TODAY TAGS
===================================================== */

function updateTodayTags(){

  const now=new Date();

  const key=
    dateKey(now);

  const today=
    getAllEvents()
      .filter(
        e=>e.date===key
      );

  const tags=
    document.getElementById(
      "todayTags"
    );

  if(!today.length){

    tags.innerHTML=`

      <div class="holiday-tag">
        🌎 특별한 지정일이 없는 날
      </div>

    `;

    return;

  }

  tags.innerHTML =
    today
      .slice(0,15)
      .map(e=>`

        <div class="holiday-tag">
          ${e.icon}
          ${escapeHTML(e.name)}
        </div>

      `)
      .join("");

}

/* =====================================================
   HOLIDAY THEME
===================================================== */

let previousTheme="";

function holidayTheme(){

  const now=new Date();

  const md=
    dateKey(now);

  document.body.classList.remove(
    "theme-christmas",
    "theme-children",
    "theme-liberation",
    "theme-newyear",
    "theme-holiday"
  );

  let theme="";

  if(md==="12-25"){

    theme=
      "theme-christmas";

  }
  else if(md==="05-05"){

    theme=
      "theme-children";

  }
  else if(md==="08-15"){

    theme=
      "theme-liberation";

  }
  else if(md==="01-01"){

    theme=
      "theme-newyear";

  }
  else if(
    [
      "03-01",
      "06-06",
      "07-17",
      "10-03",
      "10-09",
      "09-25",
      "02-17",
      "05-24"
    ].includes(md)
  ){

    theme=
      "theme-holiday";

  }

  if(theme){

    document.body.classList.add(
      theme
    );

  }

  if(
    theme!==previousTheme
  ){

    previousTheme=theme;

    createEffects(theme);

  }

}

/* =====================================================
   EFFECTS
===================================================== */

function createEffects(theme){

  const layer=
    document.getElementById(
      "effects"
    );

  layer.innerHTML="";

  if(
    theme==="theme-christmas"
  ){

    for(
      let i=0;
      i<65;
      i++
    ){

      const el=
        document.createElement(
          "div"
        );

      el.className="snow";

      el.style.left=
        Math.random()*100+
        "%";

      el.style.animationDuration=
        5+
        Math.random()*8+
        "s";

      el.style.animationDelay=
        Math.random()*8+
        "s";

      el.style.opacity=
        .3+
        Math.random()*.7;

      layer.appendChild(el);

    }

  }

  else if(
    theme==="theme-children"
  ){

    for(
      let i=0;
      i<18;
      i++
    ){

      const el=
        document.createElement(
          "div"
        );

      el.className="balloon";

      el.style.left=
        Math.random()*100+
        "%";

      el.style.animationDelay=
        Math.random()*10+
        "s";

      el.style.background=
        `hsl(
          ${Math.random()*360},
          80%,
          65%
        )`;

      layer.appendChild(el);

    }

  }

  else if(theme){

    for(
      let i=0;
      i<55;
      i++
    ){

      const el=
        document.createElement(
          "div"
        );

      el.className=
        "confetti";

      el.style.left=
        Math.random()*100+
        "%";

      el.style.background=
        `hsl(
          ${Math.random()*360},
          80%,
          65%
        )`;

      el.style.animationDuration=
        5+
        Math.random()*7+
        "s";

      el.style.animationDelay=
        Math.random()*8+
        "s";

      layer.appendChild(el);

    }

  }

}

/* =====================================================
   MODAL
===================================================== */

const modalBg=
  document.getElementById(
    "modalBg"
  );

document.getElementById(
  "addBtn"
).onclick=()=>{

  modalBg.classList.add(
    "show"
  );

};

document.getElementById(
  "cancelBtn"
).onclick=
  closeModal;

modalBg.addEventListener(
  "click",
  e=>{

    if(
      e.target===modalBg
    ){

      closeModal();

    }

  }
);

function closeModal(){

  modalBg.classList.remove(
    "show"
  );

  document.getElementById(
    "eventName"
  ).value="";

  document.getElementById(
    "eventDate"
  ).value="";

}

/* =====================================================
   SAVE CUSTOM
===================================================== */

document.getElementById(
  "saveBtn"
).onclick=()=>{

  const name=
    document.getElementById(
      "eventName"
    ).value.trim();

  const date=
    document.getElementById(
      "eventDate"
    ).value;

  const category=
    document.getElementById(
      "eventCategory"
    ).value;

  if(!name || !date){

    showToast(
      "이름과 날짜를 입력해주세요."
    );

    return;

  }

  const d=
    new Date(
      date+"T00:00:00"
    );

  customEvents.push({

    name,

    date:
      pad(
        d.getMonth()+1
      )+
      "-" +
      pad(
        d.getDate()
      ),

    icon:"📌",

    category

  });

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      customEvents
    )
  );

  closeModal();

  renderCategories();

  render();

  updateTodayTags();

  showToast(
    "D-Day가 추가되었습니다!"
  );

};

/* =====================================================
   DELETE
===================================================== */

function deleteCustom(encodedName){

  const name=
    decodeURIComponent(
      encodedName
    );

  const index=
    customEvents.findIndex(
      e=>e.name===name
    );

  if(index<0){
    return;
  }

  if(
    !confirm(
      `"${name}" D-Day를 삭제할까요?`
    )
  ){
    return;
  }

  customEvents.splice(
    index,
    1
  );

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      customEvents
    )
  );

  renderCategories();

  render();

  updateTodayTags();

  showToast(
    "삭제되었습니다."
  );

}

/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
  "search"
).addEventListener(
  "input",
  render
);

/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

  const toast=
    document.getElementById(
      "toast"
    );

  toast.textContent=
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer=
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      2200
    );

}

/* =====================================================
   DAY CHANGE
===================================================== */

let lastDay=
  dateKey(
    new Date()
  );

function checkDateChange(){

  const today=
    dateKey(
      new Date()
    );

  if(
    today!==lastDay
  ){

    lastDay=today;

    holidayTheme();

    updateTodayTags();

    updateYear();

    updateClock();

    loadHistory();

    render();

    showToast(
      "📅 새로운 하루가 시작되었습니다."
    );

  }

}

/* =====================================================
   INIT
===================================================== */

function init(){

  renderCategories();

  render();

  updateClock();

  updateYear();

  updateTodayTags();

  holidayTheme();

  loadHistory();

}

init();

/* =====================================================
   LIVE LOOP
===================================================== */

setInterval(()=>{

  updateClock();

  updateYear();

  holidayTheme();

  checkDateChange();

},1000);

</script>
